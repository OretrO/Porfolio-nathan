    <!-- Thème posé avant le premier affichage, pour éviter un flash de la mauvaise couleur -->
    <script>
      (function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('np-theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
        } catch (e) {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      html { background: #eeebe5; }
      html[data-theme='dark'] { background: #141311; }
    </style>
